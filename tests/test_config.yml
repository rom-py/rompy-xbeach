model_type: xbeach
grid:
  model_type: regular
  ori:
    x: 115.594239
    y: -32.641104
    crs: EPSG:4326
  alfa: 347
  dx: 10
  dy: 15
  nx: 230
  ny: 220
  crs: EPSG:28350
bathy:
  model_type: xbeach_bathy
  source:
    model_type: geotiff
    filename: ./data/bathy.tif
  posdwn: False
  interpolator:
    model_type: scipy_regular_grid
    kwargs:
      method: linear
      fill_value: null
  left: 3
  right: 3
  extension:
    model_type: linear
    depth: 25
    slope: 0.3
# Model input data
input:
  wave:
    model_type: station_param_jonstable
    source:
      model_type: file
      uri: ./data/smc-params-20230101.nc
      crs: 4326
    coords:
      s: seapoint
    hm0: phs1
    tp: ptp1
    mainang: pdir1
    gammajsp: ppe1
    dspr: pspr1
  wind:
    model_type: wind_station
    source:
      model_type: file
      uri: ./data/smc-params-20230101.nc
      crs: 4326
    coords:
      s: seapoint
    wind_vars:
      model_type: wind_vector
      u: uwnd
      v: vwnd
  tide:
    model_type: tide_cons_grid
    source:
      model_type: oceantide
      reader: read_otis_binary
      kwargs:
        gfile: ./data/swaus_tide_cons/grid_m2s2n2k2k1o1p1q1mmmf
        hfile: ./data/swaus_tide_cons/h_m2s2n2k2k1o1p1q1mmmf
        ufile: ./data/swaus_tide_cons/u_m2s2n2k2k1o1p1q1mmmf
      crs: 4326
    coords:
      x: lon
      y: lat
# ========
# Physics
# ========
physics:
  wavemodel:
    model_type: surfbeat
    break:
      model_type: roelvink1
      alpha: 1.0
      delta: 0.0
      gamma: 0.55
      n: 10
      wavfric:
        wavfriccoef: 0.1
  roller:
    beta: 0.1
  vegetation:
    nveg: 2
    veggiefile:
      source: /source/csiro/rompy-xbeach/tests/data/wind.csv
  bedfriction:
    model_type: cf
    bedfriccoef: 0.01
  wci:
    cats: 4.0
    hwci: 0.1
    hwcimax: 100.0
  wbc:
    nmax: 0.8
    wbcevarreduce: 1.0
    bclwonly: False
    swkhmin: -0.01
    wbcRemoveStokes: 1
    wbcScaleEnergy: 1
    cyclicdiradjust: 0
  wave_numerics:
    scheme: warmbeam
    maxiter: 500
    maxerror: 0.0005
    wavint: 600.0
  flow_numerics:
    eps: 0.01
    epsi: 0.2
    eps_sd: 0.5
    hmin: 0.01
    deltahmin: 0.01
    umin: 0.1
    secorder: 1
    oldhu: 1
  constants:
    rho: 1025
    g: 9.81
    depthscale: 1.0
# =========
# Sediment
# =========
sediment:
  groundwater:
    aquiferbot: -10.0
    aquiferbotfile: null
    dwetlayer: 0.1
    gw0: 0.0
    gw0file: null
    gwReturb: 100.0
    gwfastsolve: 0
    gwheadmodel: parabolic
    gwhorinfil: 0
    gwnonh: 0
    gwscheme: laminar
    kx: 0.0001
    ky: 0.0001
    kz: 0.0001
  bed_update:
    frac_dz: 0.7
    split: 1.01
    merge: 0.01
    nd_var: 2
  morphology:
    morfac: 1.0
  sedtrans:
    BRfac: 1.0
    Tbfac: 1.0
  q3d:
    deltar: 0.025
    kmax: 100
    rwave: 2.0
    sigfac: 1.3
    vicmol: 0.00001
    vonkar: 0.4
# Wave boundary conditions
front: abs_2d #1
back: abs_2d #2
left: neumann #0
right: neumann #0
rugdepth: 0.011
tunits: seconds since 1970-01-01 00:00:00.00 +00
order: 1
lateralwave: wavecrest
zs0: null
thetamin: -80
thetamax: 80
dtheta: 10.0
paulrevere: land
cfl: 0.8
mpi:
  mpiboundary: auto
output:
  outputformat: netcdf
  ncfilename: xboutput_test.nc
  timings: True
  tstart: 0.
  tintm: 3600.0
  tspoint:
    source: /source/csiro/rompy-xbeach/tests/data/ssh.csv
  meanvars:
    - H
    - thetamean
    - hh
    - u
    - v
    - D
    - R
    - k
    - ue
    - ve
    - urms
    - Qb
    - zb
    - zs
  globalvars:
    - H
  points:
    - [0.0, 800.0]
    - [2000.0, 1600.0]
  rugauges:
    - [0.0, 800.0]
  pointvars:
    - H
    - ue
    - ve