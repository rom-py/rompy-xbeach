name: XBeach docker image

# Builds the XBeach runtime images in docker/ and publishes them to
# ghcr.io/rom-py/xbeach:
#   - one tag per XBeach release listed in docker/releases.txt
#   - trunk-r<revision> for the Deltares SVN trunk, where <revision> is the last
#     revision that changed the trunk; latest points to the newest trunk image
#
# Every image must run workspaces generated by rompy-xbeach (docker/test_image.py)
# before it is pushed. Pull requests only build and test.
#
# The weekly schedule publishes a new trunk image when the trunk has changed since
# the last one. Changes to docker/ and manual runs rebuild all images.

on:
  push:
    branches: [main, output]
    paths:
      - docker/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker/**
      - .github/workflows/docker.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      trunk_revision:
        description: XBeach SVN trunk revision to build (default is the latest)
        required: false
        default: ""

env:
  IMAGE: ghcr.io/rom-py/xbeach
  XBEACH_SVN: https://svn.oss.deltares.nl/repos/xbeach

jobs:
  matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the trunk revision
        id: trunk
        run: |
          if [ -n "${{ inputs.trunk_revision }}" ]; then
            revision="${{ inputs.trunk_revision }}"
          else
            sudo apt-get install -y --no-install-recommends subversion > /dev/null
            revision=$(svn info --non-interactive --show-item last-changed-revision "$XBEACH_SVN/trunk")
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "XBeach trunk revision: $revision"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the trunk image is published
        id: published
        run: |
          if docker manifest inspect "$IMAGE:trunk-r${{ steps.trunk.outputs.revision }}" > /dev/null 2>&1; then
            echo "trunk=true" >> "$GITHUB_OUTPUT"
          else
            echo "trunk=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List the images to build
        id: builds
        env:
          EVENT: ${{ github.event_name }}
          REVISION: ${{ steps.trunk.outputs.revision }}
          TRUNK_PUBLISHED: ${{ steps.published.outputs.trunk }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          builds = []
          revision = os.environ["REVISION"]
          scheduled = os.environ["EVENT"] == "schedule"
          # Scheduled runs only publish a trunk revision that is not published yet
          if not scheduled:
              for line in open("docker/releases.txt"):
                  if line.strip() and not line.startswith("#"):
                      tag, svn_tag, base_image = line.split()
                      builds.append(
                          {
                              "tags": tag,
                              "svn_path": f"tags/{svn_tag}",
                              "revision": "HEAD",
                              "version": tag,
                              "base_image": base_image,
                          }
                      )
          if not (scheduled and os.environ["TRUNK_PUBLISHED"] == "true"):
              builds.append(
                  {
                      "tags": f"trunk-r{revision},latest",
                      "svn_path": "trunk",
                      "revision": revision,
                      "version": f"trunk-r{revision}",
                      "base_image": "ubuntu:24.04",
                  }
              )
          print(f"builds={json.dumps(builds)}")
          EOF

  build:
    needs: matrix
    if: needs.matrix.outputs.builds != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.matrix.outputs.builds) }}
    name: build ${{ matrix.build.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rompy-xbeach
        run: pip install ".[extra]"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: xbeach:test
          build-args: |
            BASE_IMAGE=${{ matrix.build.base_image }}
            XBEACH_SVN_PATH=${{ matrix.build.svn_path }}
            XBEACH_REVISION=${{ matrix.build.revision }}
            XBEACH_VERSION=${{ matrix.build.version }}
          cache-from: type=gha,scope=${{ matrix.build.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.build.version }}

      - name: Run rompy-xbeach workspaces in the image
        run: python docker/test_image.py xbeach:test

      - name: Image tags
        id: tags
        run: |
          tags=""
          for tag in $(echo "${{ matrix.build.tags }}" | tr ',' ' '); do
            tags="${tags}${IMAGE}:${tag},"
          done
          echo "tags=${tags%,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ matrix.build.base_image }}
            XBEACH_SVN_PATH=${{ matrix.build.svn_path }}
            XBEACH_REVISION=${{ matrix.build.revision }}
            XBEACH_VERSION=${{ matrix.build.version }}
          cache-from: type=gha,scope=${{ matrix.build.version }}
