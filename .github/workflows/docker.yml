name: XBeach docker image

# Builds the XBeach runtime image in docker/ and publishes it to
# ghcr.io/rom-py/xbeach. Pull requests only build the image and run a smoke test.

on:
  push:
    branches: [main, output]
    paths:
      - docker/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - docker/**
      - .github/workflows/docker.yml
  workflow_dispatch:
    inputs:
      xbeach_revision:
        description: XBeach SVN trunk revision to build
        required: false
        default: "6147"

env:
  IMAGE: ghcr.io/rom-py/xbeach
  XBEACH_REVISION: ${{ inputs.xbeach_revision || '6147' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: xbeach:test
          build-args: XBEACH_REVISION=${{ env.XBEACH_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm xbeach:test bash -c "command -v xbeach && command -v mpirun"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: |
            ${{ env.IMAGE }}:r${{ env.XBEACH_REVISION }}
            ${{ env.IMAGE }}:latest
          build-args: XBEACH_REVISION=${{ env.XBEACH_REVISION }}
          cache-from: type=gha
