site_name: rompy-xbeach
site_description: Configure and run the XBeach coastal model from Python and YAML
site_url: https://rom-py.github.io/rompy-xbeach/
repo_url: https://github.com/rom-py/rompy-xbeach
repo_name: rom-py/rompy-xbeach
edit_uri: edit/output/docs/

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first model: getting-started/first-model.md
  - User guide:
      - How rompy-xbeach works: user-guide/how-it-works.md
      - Configuration: user-guide/configuration.md
      - Grid and bathymetry: user-guide/grid-and-bathymetry.md
      - Data sources: user-guide/sources.md
      - Waves: user-guide/waves.md
      - Tide and water levels: user-guide/water-levels.md
      - Wind: user-guide/wind.md
      - Physics: user-guide/physics.md
      - Sediment and morphology: user-guide/sediment.md
      - Flow and tide boundaries: user-guide/boundary-conditions.md
      - Output: user-guide/output.md
      - Running XBeach: user-guide/running.md
      - Hotstart and chained runs: user-guide/hotstart.md
      - Troubleshooting: user-guide/troubleshooting.md
  - Tutorial: tutorial.md
  - Examples: examples.md
  - Reference:
      - reference/index.md
      - Config: reference/config.md
      - Grid: reference/grid.md
      - Bathymetry: reference/bathy.md
      - Sources: reference/sources.md
      - Data interfaces: reference/data.md
      - Wave boundaries: reference/wave-boundaries.md
      - Water levels: reference/water-levels.md
      - Wind: reference/wind.md
      - Physics: reference/physics.md
      - Sediment: reference/sediment.md
      - Flow and tide boundaries: reference/boundary-conditions.md
      - Output: reference/output.md
      - Hotstart and MPI: reference/hotstart-mpi.md
      - Base types: reference/types.md
      - Parameter index: reference/parameters.md
  - Development:
      - Contributing: development/contributing.md
      - Changelog: development/changelog.md

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/rompy.css

extra:
  rompy:
    site: xbeach

plugins:
  - search
  - markdown-exec
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          inventories:
            - https://docs.python.org/3/objects.inv
            - https://docs.pydantic.dev/latest/objects.inv
            - https://docs.xarray.dev/en/stable/objects.inv
            # ROMPY_INVENTORY points local builds at an unpublished rompy site.
            - url: !ENV [ROMPY_INVENTORY, "https://rom-py.github.io/rompy/objects.inv"]
              base_url: https://rom-py.github.io/rompy/
          options:
            docstring_style: auto
            docstring_section_style: table
            preload_modules: [rompy]
            inherited_members: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_if_no_docstring: false
            show_source: false
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            members_order: source
            group_by_category: true
            summary: false
            filters: ["!^_", "!^model_(?!type$)"]
            extensions:
              - griffe_pydantic: {schema: false}
              - rompy_docs.griffe:PydanticFieldRules

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
